name: Publish To Repository

# TODO this attempts to run only after successful CI build job - will only publish SNAPSHOT versions
on:
  workflow_run:
    workflows: ["Java CI with Gradle"]
    branches: ["main"]
    types:
      - completed
  workflow_dispatch: # can also run manually....

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' ||github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      actions: read

    steps:
      - name: Verify latest CI for manual publish
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual publishing must target main."
            exit 1
          fi

          if ! gh api "repos/$GITHUB_REPOSITORY/actions/workflows/gradle.yml/runs?branch=main&event=push&per_page=1" |
            jq -e --arg sha "$GITHUB_SHA" \
             '.workflow_runs | length > 0 and
             .[0].status == "completed" and
             .[0].conclusion == "success" and
             .[0].head_sha == $sha' > /dev/null; then
            echo "The latest main CI run must have succeeded for this commit."
             exit 1
          fi

      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish with Gradle Wrapper
        run: ./gradlew publishSnapshots -DskipSigning
        env:
          UKSRC_REPO_USERNAME: ${{ secrets.UKSRC_REPO_USERNAME }}
          UKSRC_REPO_PASSWORD: ${{ secrets.UKSRC_REPO_PASSWORD }}

  
